# EPITA PIE alacritty - dark, no surprises. Linked by install.sh to
# ~/.config/alacritty/alacritty.toml (alacritty is the PIE's default terminal).

[font]
size = 11.0                      # points

[font.normal]
family = "DejaVu Sans Mono"      # shipped on the image; no font install needed

[colors.primary]
background = "#101014"           # near-black, slightly blue
foreground = "#d0d0d0"           # soft white: contrast without glare

[scrolling]
history = 100000                 # scrollback lines kept (default 10000)
