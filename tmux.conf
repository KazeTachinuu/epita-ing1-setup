set -g mouse on              # click to select pane, drag borders, wheel scrolls
set -g history-limit 100000  # scrollback lines per pane (default 2000)
set -g base-index 1          # number windows from 1, matching the keyboard row
setw -g mode-keys vi         # vi keys in copy mode: v selects, y yanks
set -g escape-time 10        # ms after Esc for a sequence (500 lags vim)
